services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: on-failure
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    entrypoint: >
      sh -lc "
        apt-get update &&
        apt-get install -y --no-install-recommends curl &&
        rm -rf /var/lib/apt/lists/* &&
        exec /qdrant/entrypoint.sh
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:6333/healthz >/dev/null || exit 1",
        ]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: on-failure
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 2s

  rag:
    build:
      context: .
      dockerfile: services/rag/Dockerfile
      args:
        UV_EXTRAS: "llama"
    restart: on-failure
    ports:
      - "8001:8000"
    volumes:
      - hf_cache:/app/.cache/huggingface
      - app_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request;
          urllib.request.urlopen(''http://localhost:8000/healthz'').read()"',
        ]
      interval: 10s
      timeout: 3s
      retries: 30

  task_queue:
    build:
      context: .
      dockerfile: services/task_queue/Dockerfile
      args:
        UV_EXTRAS: "queue"
    restart: on-failure
    environment:
      - RAG_URL=http://rag:8000
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - hf_cache:/app/.cache/huggingface
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      rag:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "teaching_assistant.task_queue.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "2",
        "--proxy-headers",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request;
          urllib.request.urlopen(''http://localhost:8000/healthz'').read()"',
        ]
      interval: 10s
      timeout: 3s
      retries: 30

  ingest_worker:
    build:
      context: .
      dockerfile: services/task_queue/Dockerfile
      args:
        UV_EXTRAS: "queue llama"
    restart: on-failure
    command:
      [
        "/app/.venv/bin/celery",
        "-A",
        "teaching_assistant.task_queue.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
        "-Q",
        "ingest",
      ]
    environment:
      - RAG_URL=http://rag:8000
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - hf_cache:/app/.cache/huggingface
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  gen_worker:
    build:
      context: .
      dockerfile: services/task_queue/Dockerfile
      args:
        UV_EXTRAS: "queue llama"
    restart: on-failure
    command:
      [
        "/app/.venv/bin/celery",
        "-A",
        "teaching_assistant.task_queue.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
        "-Q",
        "gen,default",
      ]
    environment:
      - RAG_URL=http://rag:8000
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - hf_cache:/app/.cache/huggingface
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      rag:
        condition: service_healthy

  static:
    build:
      context: .
      dockerfile: services/static/Dockerfile
    restart: on-failure

  nginx:
    build:
      context: .
      dockerfile: services/nginx/Dockerfile
    restart: on-failure
    ports:
      - "80:80"
    depends_on:
      task_queue:
        condition: service_healthy
      static:
        condition: service_started

  metrics:
    build:
      context: .
      dockerfile: services/metrics/Dockerfile
      args:
        UV_EXTRAS: "metrics"
    restart: on-failure
    volumes:
      - ./.env:/app/.env:ro
    ports:
      - "8002:8000"
    depends_on:
      rag:
        condition: service_healthy
      task_queue:
        condition: service_healthy
      gen_worker:
        condition: service_started

volumes:
  qdrant_storage:
  hf_cache:
  app_data:
  redis_data:
