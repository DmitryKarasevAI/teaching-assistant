[project]
name = "teaching-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dmitry Karasev", email = "dakarasev@edu.hse.ru" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.128.0",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "pydantic-settings>=2.12.0",
  "python-multipart>=0.0.21",
  "uvicorn[standard]>=0.40.0",
]

[project.optional-dependencies]
queue = [
  "celery[redis]>=5.5.0,<6.0",
  "redis>=5.0.0",
]

llama = [
  "llama-index-core>=0.14.12",
  "llama-index-embeddings-huggingface>=0.6.1",
  "llama-index-llms-huggingface>=0.6.1",
  "qdrant-client>=1.16.2",
  "sentence-transformers>=3.0.0",
  "transformers>=4.40.0",
]
torch-cu126 = [
  "torch>=2.2.0 ; sys_platform == 'linux' or sys_platform == 'win32'",
]

torch-cu128 = [
  "torch>=2.2.0 ; sys_platform == 'linux' or sys_platform == 'win32'",
]

metrics = [
  "ragas>=0.4.0,<0.5",
  "openai>=1.0.0,<2.0.0",
  "python-dotenv>=1.0.0",
]

dev = [
  "pre-commit>=4.5.1",
]

[project.scripts]
teaching-assistant = "teaching_assistant:main"
[tool.uv]
conflicts = [
  [
    { extra = "torch-cu126" },
    { extra = "torch-cu128" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", extra = "torch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu128", extra = "torch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
